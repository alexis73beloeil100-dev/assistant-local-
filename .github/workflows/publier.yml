name: Publier une version

# Construit l'application sur un Windows de GitHub, fabrique le paquet de mise
# a jour depuis la version precedente, et publie les deux installateurs.
#
#   - poussee sur une branche claude/** : construction et MESURE seulement
#     (taille du paquet), rien n'est publie ;
#   - etiquette vX.Y.Z, OU commit dont le message contient [publier] :
#     construction et publication de la Release. Dans le second cas, c'est
#     GitHub qui pose l'etiquette sur le commit construit.

on:
  push:
    branches: ["claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  construire:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # 3.12 : celle de la version deja installee. Une autre changerait
      # python312.dll et toutes les extensions, et le paquet grossirait.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Executable
        run: python -m PyInstaller --noconfirm AssistantLocal.spec

      - name: Installateur complet
        run: python outils/publier.py

      # Le paquet de mise a jour se calcule contre ce qui est REELLEMENT
      # installe chez les gens. Deux sources, apres l'installateur complet
      # (publier.py refuse un arbre de travail modifie) :
      #   - manifestes/reference.txt, "version identifiant-d-execution" : un
      #     essai installe a la main, dont le manifeste est reste dans les
      #     artefacts de son execution ;
      #   - a defaut, le manifeste joint a la derniere Release.
      - name: Reference installee
        id: reference
        shell: bash
        run: |
          if [ -f manifestes/reference.txt ]; then
            read -r version execution < manifestes/reference.txt
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "execution=$execution" >> "$GITHUB_OUTPUT"
            echo "Reference : essai $version, execution $execution"
          fi

      - name: Manifeste de l'essai installe
        if: steps.reference.outputs.execution != ''
        uses: actions/download-artifact@v4
        with:
          name: manifeste-${{ steps.reference.outputs.version }}
          path: manifestes
          run-id: ${{ steps.reference.outputs.execution }}
          github-token: ${{ github.token }}

      - name: Manifeste de la derniere Release
        if: steps.reference.outputs.execution == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern "*.json" --dir manifestes --clobber || echo "aucun manifeste joint a la derniere Release"

      - name: Versions
        id: versions
        shell: bash
        run: |
          vers=$(python -c "import assistant; print(assistant.__version__)")
          depuis=$(python - <<'PY'
          import re
          from pathlib import Path
          import assistant
          v = lambda s: tuple(int(n) for n in re.findall(r"\d+", s))
          avant = [p.stem for p in Path("manifestes").glob("*.json")
                   if v(p.stem) < v(assistant.__version__)]
          print(max(avant, key=v))
          PY
          )
          echo "vers=$vers" >> "$GITHUB_OUTPUT"
          echo "depuis=$depuis" >> "$GITHUB_OUTPUT"
          echo "De $depuis vers $vers"

      - name: Paquet de mise a jour
        shell: bash
        run: |
          python outils/paquet_maj.py "${{ steps.versions.outputs.depuis }}"
          mv "installateur/MiseAJour_AssistantLocal_${{ steps.versions.outputs.vers }}.exe" \
             "installateur/MiseAJour_AssistantLocal_${{ steps.versions.outputs.depuis }}_vers_${{ steps.versions.outputs.vers }}.exe"
          ls -l installateur

      # Le paquet a tester AVANT toute publication : il se telecharge depuis
      # la page de cette execution (onglet Actions), sans Release.
      - name: Paquet a tester
        uses: actions/upload-artifact@v4
        with:
          name: MiseAJour-${{ steps.versions.outputs.depuis }}-vers-${{ steps.versions.outputs.vers }}
          path: installateur/MiseAJour_AssistantLocal_${{ steps.versions.outputs.depuis }}_vers_${{ steps.versions.outputs.vers }}.exe
          retention-days: 30

      # Le manifeste de la nouvelle version servira de reference a la
      # suivante : il doit etre recupere et versionne.
      - name: Manifeste
        uses: actions/upload-artifact@v4
        with:
          name: manifeste-${{ steps.versions.outputs.vers }}
          path: manifestes/${{ steps.versions.outputs.vers }}.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publier]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vers="${{ steps.versions.outputs.vers }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v$vers" || { echo "etiquette $GITHUB_REF_NAME, code en $vers"; exit 1; }
          fi
          gh release create "v$vers" \
            --target "${GITHUB_SHA}" \
            --title "Assistant local $vers" \
            --notes-file "notes_de_version/$vers.md" \
            "installateur/MiseAJour_AssistantLocal_${{ steps.versions.outputs.depuis }}_vers_$vers.exe" \
            installateur/Installer_AssistantLocal.exe \
            "manifestes/$vers.json"
