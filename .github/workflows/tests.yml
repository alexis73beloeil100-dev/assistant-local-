name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Les bibliotheques CUDA (plus de 2 Go) ne servent qu'a la transcription
      # sur la carte graphique : aucun test n'en a besoin.
      - name: Dependances
        shell: bash
        run: |
          grep -vi '^nvidia-' requirements.txt > requirements-ci.txt
          grep -v '^-r ' requirements-dev.txt >> requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Tests
        run: python -m pytest -q tests
