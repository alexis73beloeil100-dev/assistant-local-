name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Les bibliotheques CUDA (plus de 2 Go) ne servent qu'a la transcription
      # sur la carte graphique : aucun test n'en a besoin.
      - name: Dependances
        shell: bash
        run: |
          grep -vi '^nvidia-' requirements.txt > requirements-ci.txt
          grep -v '^-r ' requirements-dev.txt >> requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Tests
        # Les deux tests du manifeste de la version courante : il ne nait
        # qu'a la construction (voir DESELECTION_PRE_VOL dans livrer.py).
        run: >-
          python -m pytest -q tests
          --deselect tests/test_mise_a_jour.py::test_partir_de_la_version_courante_est_refuse
          --deselect tests/test_mise_a_jour.py::test_le_manifeste_de_la_version_publiee_est_versionne
